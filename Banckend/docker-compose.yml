services:
  db-mariadb:
    image: mariadb:10.6
    container_name: printer_db_manager
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 'root123'
      MYSQL_DATABASE: 'imimpressoras_db'
      MYSQL_USER: 'app_user'
      MYSQL_PASSWORD: 'python123'
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build: .  
    container_name: printer_app_backend
    restart: unless-stopped
    ports:
      - "8000:8000" 
    env_file:
      - .env      
    depends_on:
      - db-mariadb  

volumes:
  mariadb_data:

