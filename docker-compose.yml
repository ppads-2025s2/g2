version: '3.8'

services:
  db-mariadb:
    image: mariadb:10.6
    container_name: printer_db_manager
    restart: unless-stopped
    
    # Configurações do banco
    environment:
      # Senha de administrador (exemplo)
      MYSQL_ROOT_PASSWORD: 'root123' 
      
      # Nome do banco que vamos usar
      MYSQL_DATABASE: 'impressoras_db'
      
      # Usuário e senha que o Python vai usar (exemplo)
      MYSQL_USER: 'app_user'
      MYSQL_PASSWORD: 'python123'
      
    ports:
      - "3306:3306" # Expõe a porta do banco
      
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:

